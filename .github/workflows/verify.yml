name: Verify exact QEC result

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay exact verifier
        run: |
          python verify_release.py --json > verification-report.replayed.json
          cmp verification-report.json verification-report.replayed.json
      - name: Human-readable replay
        run: python verify_release.py
